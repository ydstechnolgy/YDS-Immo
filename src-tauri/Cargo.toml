[package]
name = "yds-immo"
version = "1.0.0"
description = "YDS Immo : logiciel de gestion de biens immobiliers pour démarcheurs"
authors = ["YDS Tech"]
license = ""
repository = "https://github.com/ydstechnolgy/YDS-Immo"
edition = "2021"
rust-version = "1.77"

[lib]
name = "yds_immo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
