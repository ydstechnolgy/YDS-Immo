name: Build YDS Immo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Version
        shell: bash
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version=process.env.APP_VERSION;fs.writeFileSync(f,JSON.stringify(j,null,2))"
      - run: npx tauri build
      - name: Nom stable
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/YDS-Immo-Installation.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/YDS-Immo-Installation.exe }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Clé de signature (si fournie)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
      - name: Compiler l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          task=assembleDebug; [ -n "$KEYSTORE_FILE" ] && task=assembleRelease
          if ! ./gradlew $task --no-daemon > "$RUNNER_TEMP/gradle.log" 2>&1; then
            msg=$(grep -A12 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -20 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle::$msg"
            exit 1
          fi
      - name: Nom stable
        run: |
          mkdir out
          f=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          [ -z "$f" ] && f=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$f" out/yds-immo.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/yds-immo.apk }

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION}" out/* \
            --repo "${{ github.repository }}" \
            --title "YDS Immo ${APP_VERSION}" \
            --notes "Installation Windows : YDS-Immo-Installation.exe — Android : yds-immo.apk" \
            --latest
